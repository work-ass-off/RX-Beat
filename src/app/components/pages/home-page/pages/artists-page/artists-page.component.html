@let artists = artists$ | async;

@if (loading()) {
  <app-loader-spinner />
} @else {
  <ul class="list">
    @for (artist of artists; track artist.id) {
      <li class="item">
        <app-artist [artist]="artist" [routerLink]="[artist.id]" />
      </li>
    }
  </ul>
  <router-outlet />
}

@if (notificationService.notification()) {
  <div class="error">{{ notificationService.notification() }}</div>
}
