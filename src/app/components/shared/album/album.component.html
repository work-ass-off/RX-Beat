@if (album().image) {
  <img class="image" [src]="album().image" [alt]="album().name" />
} @else {
  <div class="image-placeholder">{{ album().name }}</div>
}
<span class="name">{{ album().name }}</span>
<span class="artist-name">{{ album().artist_name }}</span>
<span class="release">{{ album().releasedate | releaseDate: 'year' }}</span>
