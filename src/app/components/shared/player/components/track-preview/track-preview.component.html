@if (track(); as currentTrack) {
  <div class="track-cover">
    <img [src]="currentTrack.image" alt="track cover" class="track-cover" />
  </div>
  <div class="track-info">
    <h3>{{ currentTrack.name }}</h3>
    <p>{{ currentTrack.artist_name }}</p>
  </div>

  <app-playlist-menu [trackId]="currentTrack.id"></app-playlist-menu>
}
