<a class="btn-primary" routerLink="/about">{{ 'HEADER.ABOUT' | translate }}</a>
@if (isLoggedIn()) {
  <button class="btn" (click)="onLogout()">{{ 'HEADER.LOGOUT' | translate }}</button>
} @else {
  <a class="btn-transparent sign-up" routerLink="/signup">{{ 'HEADER.SIGNUP' | translate }}</a>
  <button class="btn" (click)="onLoginNavigation()">{{ 'HEADER.LOGIN' | translate }}</button>
}
